<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그내종 · 로그인 (시안)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<header id="site-header"></header>

<!--
  화면 시안만 있다. 인증을 구현하지 않았으므로 입력칸과 버튼을 모두 비활성화했고, 이 화면은 어떤 값도 서버로 보내지 않는다.
  설계: docs/auth_design.md
-->
<main class="measure">
  <section class="lede">
    <h1>로그인</h1>
    <p class="notice notice-strong">
      <strong>화면 시안입니다. 로그인은 아직 동작하지 않습니다.</strong><br>
      지금 그내종은 이 컴퓨터에서만 쓰는 단일 사용자 버전이라 계정·비밀번호·사용자별 데이터 분리가 없습니다.
      입력칸은 비활성화되어 있고, 이 화면은 어떤 값도 보내지 않습니다.
    </p>
    <p class="status">동작 상태: 화면만 · 인증과 다중 사용자는 후속 개발</p>
  </section>

  <section class="section section-tight" aria-label="로그인 시안">
    <form onsubmit="return false" aria-disabled="true">
      <label class="field"><span>이메일</span><input type="email" disabled placeholder="name@example.com"></label>
      <label class="field"><span>비밀번호</span><input type="password" disabled></label>
      <div class="form-actions"><button type="button" disabled>로그인</button></div>
    </form>
    <h4>다른 방법으로 계속하기</h4>
    <div class="form-actions">
      <button type="button" disabled>Apple로 계속하기</button>
      <button type="button" disabled>Google로 계속하기</button>
      <button type="button" disabled>카카오로 계속하기</button>
    </div>
    <h4>처음이신가요?</h4>
    <p>회원가입 → <a href="/onboarding">최초 투자 프로필 설정</a> → 메인 화면 순서로 이어집니다. 지금은 가입 없이 프로필 설정 화면만 열어 볼 수 있습니다.</p>
    <p class="meta"><a href="/">메인으로 돌아가기</a></p>
  </section>
</main>

<footer class="site-foot" id="site-footer"></footer>
</div>
<script src="/common.js"></script>
<script>renderChrome("account");</script>
</body>
</html>
