<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>루틴 플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">
    <nav class="tabs" aria-label="화면 전환" id="tabs" hidden>
      <button type="button" class="tab is-on" data-view="week">PLANNER</button>
      <button type="button" class="tab" data-view="routines">ROUTINES</button>
      <span class="account" id="account" hidden>
        <span id="accountEmail"></span>
        <button type="button" class="link-btn" id="logout">로그아웃</button>
      </span>
    </nav>

    <!-- 로그인 (Supabase 모드에서만 보인다) -->
    <section id="authView" class="auth" hidden>
      <h1 class="display">LOG IN</h1>
      <p class="sub" id="authSub">루틴 플래너를 쓰려면 로그인해 주세요. 내 할 일은 나만 볼 수 있어요.</p>
      <form id="authForm" class="auth-form" autocomplete="on">
        <label class="label" for="authEmail">Email · 이메일</label>
        <input class="add-input" id="authEmail" name="email" type="email" autocomplete="username" required>
        <label class="label" for="authPassword">Password · 비밀번호 (8자 이상)</label>
        <input class="add-input" id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required>
        <p class="saved" id="authMessage" role="alert"></p>
        <div class="add-more">
          <button type="button" class="link-btn" id="authSwitch">처음이에요 · 가입하기</button>
          <button type="submit" class="solid-btn" id="authSubmit">로그인</button>
        </div>
        <button type="button" class="link-btn" id="authResend" hidden>확인 메일 다시 보내기</button>
      </form>
    </section>

    <section id="weekView" hidden>
      <div class="week-bar">
        <p class="week-label" id="weekLabel"></p>
        <div class="week-nav">
          <button type="button" class="nav-btn" id="prevWeek" aria-label="지난주">‹</button>
          <button type="button" class="nav-btn nav-text" id="thisWeek">오늘</button>
          <button type="button" class="nav-btn" id="nextWeek" aria-label="다음주">›</button>
        </div>
      </div>
      <div id="week"></div>
    </section>

    <section id="routineView" hidden>
      <header class="routine-head">
        <h1 class="display">ROUTINES</h1>
        <p class="sub">요일과 시간을 정해 두면 매일 체크리스트가 자동으로 생겨요. 바꾼 내용은 내일부터 반영돼요.</p>
      </header>
      <div id="tracker"></div>
      <div id="routineFormSlot"></div>
    </section>

    <p class="toast" id="error" role="alert" hidden></p>
  </main>

  <!-- 어느 날짜에든 할 일을 바로 추가하는 버튼 -->
  <button type="button" class="fab" id="fab" hidden aria-label="할 일 추가" aria-haspopup="dialog">+</button>

  <dialog class="sheet-dialog" id="addDialog" aria-labelledby="addDialogTitle">
    <form method="dialog" id="addDialogForm" autocomplete="off">
      <h2 class="label" id="addDialogTitle">New task · 할 일 추가</h2>
      <input class="add-input" name="title" placeholder="무엇을 할까요?" maxlength="200" required aria-label="할 일">
      <div class="add-more">
        <input class="field" type="date" name="date" required aria-label="날짜">
      </div>
      <div class="add-more">
        <input class="field" type="time" name="start_time" aria-label="시작 시간">
        <span class="dash">–</span>
        <input class="field" type="time" name="end_time" aria-label="끝 시간">
        <label class="check"><input type="checkbox" name="is_important"> 중요</label>
      </div>
      <p class="saved" id="addDialogError" role="alert"></p>
      <div class="add-more">
        <button type="button" class="line-btn" id="addDialogCancel">취소</button>
        <button type="submit" class="solid-btn" value="add">추가</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
