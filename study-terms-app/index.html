<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아, 그게 뭐더라?</title>
<meta name="application-name" content="아그뭐">
<meta name="apple-mobile-web-app-title" content="아그뭐">
<meta name="description" content="헷갈리는 용어를 내 말로 설명해 보며 익히는 용어 사전 겸 암기장">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
<div class="app">
  <header class="masthead">
    <p class="brand">WHAT'S THE WORD AGAIN?</p>
    <div class="mast-row">
      <h1 class="title"><span class="hl">아, 그게 뭐더라?</span></h1>
      <span class="mast-rule" aria-hidden="true"></span>
      <div class="mast-note">
        <p class="line">외워야 할 게 있으신가요?</p>
        <p class="line">분명 봤는데 생각이 안 날 때 하는 말.<br class="m-only"> 그 순간 바로 열어 보세요.</p>
        <p class="info">공부할 용어를 불러와 나만의 사전을 만들어 보세요.</p>
        <p class="keys"><span><kbd>/</kbd> 검색</span><span><kbd>Enter</kbd> 첫 결과 열기</span><span><kbd>Esc</kbd> 지우기</span></p>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="side" aria-label="용어 찾기와 목록">
      <label class="sr-only" for="q">용어 검색</label>
      <input id="q" class="search" type="search" placeholder="용어 검색 — mcp, 하네스, ㅎㄴㅅ" autocomplete="off" spellcheck="false">

      <div class="progress">
        <div class="progress-text"><span>마치기</span><strong id="prog">0 / 20</strong></div>
        <div class="bar" aria-hidden="true"><div id="bar"></div></div>
      </div>

      <div class="filters" role="group" aria-label="상태로 거르기">
        <button type="button" class="chip" data-filter="all">전체 <span></span></button>
        <button type="button" class="chip" data-filter="0">알아보기 <span></span></button>
        <button type="button" class="chip" data-filter="1">다시 보기 <span></span></button>
        <button type="button" class="chip" data-filter="2">마치기 <span></span></button>
      </div>

      <div class="views" role="group" aria-label="목록 보기 방식">
        <button type="button" class="view-btn" data-view="sections">자료별로 보기</button>
        <button type="button" class="view-btn" data-view="all">전체 목록</button>
      </div>

      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <p><strong>용어집에 아직 없어요.</strong><br>다른 말이나 초성으로 찾아보세요.</p>
        <button type="button" id="show-all" class="line-btn">전체 보기</button>
      </div>
    </aside>

    <main class="detail">
      <button type="button" id="back" class="back">← 목록</button>
      <article class="card" aria-live="polite">
        <div class="card-tags">
          <span class="tag tag-black" id="c-no"></span>
          <span class="tag tag-line" id="c-src"></span>
          <span class="tag tag-line" id="c-level"></span>
        </div>

        <div class="hero">
          <h2 class="term" id="c-term"></h2>
          <div class="note-ko"><strong id="c-ko"></strong><em id="c-full"></em></div>
        </div>

        <div class="flow" id="c-flow"></div>

        <section class="section">
          <div class="section-head">
            <span class="tag tag-black">DEFINITION</span>
          </div>
          <div class="def-body">
            <p class="def-main" id="c-def"></p>
            <p class="def-sub" id="c-easy"><span class="def-k">쉽게 말하면</span><span class="def-v"></span></p>
            <p class="def-sub" id="c-ex"><span class="def-k">예를 들면</span><span class="def-v"></span></p>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="tag tag-black">MY NOTE</span>
            <span id="saved" class="saved" aria-live="polite"></span>
          </div>
          <label class="sr-only" for="mine">내 설명</label>
          <textarea id="mine" class="memo" rows="4" placeholder="이 용어를 나의 언어로 한두 문장 설명해 보세요."></textarea>
          <div class="status" role="group" aria-label="이해 상태">
            <button type="button" class="st" data-status="0">알아보기</button>
            <button type="button" class="st" data-status="1">다시 보기</button>
            <button type="button" class="st" data-status="2">마치기</button>
          </div>
          <p id="msg" class="msg" role="status"></p>
        </section>

        <footer class="related" id="c-related">연결할 용어 <span id="c-rel"></span></footer>
      </article>
    </main>
  </div>
</div>
<script src="terms.js?v=5"></script>
<script src="terms-02-01.js?v=1"></script>
<script src="terms-02-02.js?v=1"></script>
<script src="terms-02-03.js?v=1"></script>
<script src="terms-02-04.js?v=1"></script>
<script src="terms-02-05.js?v=1"></script>
<script src="terms-02-06.js?v=1"></script>
<script src="terms-02-07.js?v=1"></script>
<script src="app.js?v=8"></script>
</body>
</html>
